name = "newsai"
main = "src/worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "diariomigrante.com"
custom_domain = true

[[routes]]
pattern = "www.diariomigrante.com"
custom_domain = true

# Daily edition email: 8:30 AM ET first pass + 10 AM ET sweep (UTC crons;
# the edition_sends guard makes the second pass free if the first sent).
[triggers]
crons = ["30 12 * * *", "0 14 * * *"]

[vars]
# tinybuild.studio is the studio-wide verified Resend domain. Flip to
# "Diario Migrante <diario@diariomigrante.com>" if that domain gets verified on Resend.
EMAIL_FROM = "Diario Migrante <diario@tinybuild.studio>"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "newsai"
database_id = "e9efc42d-7b55-4afb-8d5d-ff85e02d222c"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "newsai-assets"
